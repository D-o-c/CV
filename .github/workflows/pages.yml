name: Build and Deploy CV

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: /tmp/uv-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
        with:
          python-version: "3.12"

      - name: Compile Python scripts
        run: uv run python -m py_compile tools/render_cv.py tools/render_site.py tools/smoke_site.py

      - name: Validate resume schema and required assets
        run: uv run python tools/render_cv.py --validate-only

      - name: Render LaTeX from resume JSON
        run: uv run --with jinja2==3.1.6 python tools/render_cv.py

      - name: Build CV PDF with LaTeX
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3
        with:
          root_file: CV.generated.tex
          working_directory: latex

      - name: Render MkDocs markdown from resume JSON
        run: uv run --with mkdocs-material==9.6.14 python tools/render_site.py

      - name: Run static smoke checks
        run: uv run python tools/smoke_site.py

      - name: Build MkDocs site
        run: uv run --with mkdocs-material==9.6.14 mkdocs build --strict --site-dir dist

      - name: Prepare static artifact directory
        run: |
          mkdir -p dist
          cp resume.json dist/resume.json

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

      - name: Upload preview artifact for pull requests
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cv-site-preview
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
